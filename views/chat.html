<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - FriendsChat</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <div class="chat-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>FriendsChat</h2>
                <div id="userInfo"></div>
            </div>

            <div class="server-list">
                <h3>Servers</h3>
                <button id="createServerBtn" class="btn btn-small">+ Create Server</button>
                <div id="serversList"></div>
            </div>

            <div class="dm-list">
                <h3>Direct Messages</h3>
                <div id="dmList"></div>
            </div>

            <div class="sidebar-footer">
                <button id="adminPanelBtn" class="btn btn-small" style="display: none;">Admin Panel</button>
                <button id="logoutBtn" class="btn btn-small btn-danger">Logout</button>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-main">
            <div class="channel-sidebar">
                <div id="channelHeader">
                    <h3 id="serverName">Select a server</h3>
                    <button id="createChannelBtn" class="btn btn-small" style="display: none;">+ Channel</button>
                </div>
                <div id="channelList"></div>
            </div>

            <div class="chat-area">
                <div id="chatHeader">
                    <h3 id="channelName">Welcome</h3>
                </div>

                <div id="messageArea" class="message-area">
                    <p class="welcome-message">Select a channel or start a direct message to begin chatting.</p>
                </div>

                <div class="message-input-area">
                    <form id="messageForm">
                        <input type="text" id="messageInput" placeholder="Type a message..." disabled>
                        <button type="submit" class="btn btn-primary" disabled>Send</button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <!-- Modals -->
    <div id="createServerModal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Create Server</h2>
            <form id="createServerForm">
                <div class="form-group">
                    <label for="serverName">Server Name</label>
                    <input type="text" id="serverNameInput" required>
                </div>
                <div class="form-group">
                    <label for="serverDescription">Description (optional)</label>
                    <textarea id="serverDescription"></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Create</button>
            </form>
        </div>
    </div>

    <div id="createChannelModal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Create Channel</h2>
            <form id="createChannelForm">
                <div class="form-group">
                    <label for="channelName">Channel Name</label>
                    <input type="text" id="channelNameInput" required>
                </div>
                <button type="submit" class="btn btn-primary">Create</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="/js/chat.js"></script>
</body>
</html>
